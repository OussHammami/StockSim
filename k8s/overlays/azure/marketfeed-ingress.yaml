apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: marketfeed
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /marketfeed
            pathType: Prefix
            backend:
              service:
                name: marketfeed
                port:
                  number: 80