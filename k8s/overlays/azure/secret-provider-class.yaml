apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: stocksim-secrets
  namespace: stocksim
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "${IDENTITY_CLIENT_ID}"
    keyvaultName: stocksim-kv-ouss
    tenantId: f172c246-92f1-4226-89d0-049bc5d5ff0b
    objects: |
      array:
        - |
          objectName: postgres-user
          objectType: secret
        - |
          objectName: postgres-password
          objectType: secret
        - |
          objectName: rabbitmq-user
          objectType: secret
        - |
          objectName: rabbitmq-password
          objectType: secret
        - |
          objectName: connectionstring-authdb
          objectType: secret
        - |
          objectName: connectionstring-tradingdb
          objectType: secret
        - |
          objectName: connectionstring-portfoliodb
          objectType: secret
  secretObjects:
    - secretName: postgres-auth
      type: Opaque
      data:
        - objectName: postgres-user
          key: username
        - objectName: postgres-password
          key: password
    - secretName: rabbitmq-auth
      type: Opaque
      data:
        - objectName: rabbitmq-user
          key: username
        - objectName: rabbitmq-password
          key: password
    - secretName: stocksim-connectionstrings
      type: Opaque
      data:
        - objectName: connectionstring-authdb
          key: AuthDb
        - objectName: connectionstring-tradingdb
          key: TradingDb
        - objectName: connectionstring-portfoliodb
          key: PortfolioDb